# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    # Most runs take 2 to 5 minutes. The slowest successful runs so far took
    # 4 minutes on macOS, 5 on Windows, 13 to 14 on Ubuntu release and oldrel
    # (slow downloads in setup-r and setup-r-dependencies), and 32 on devel
    # (slow downloads, a cache miss, and packages built from source).
    timeout-minutes: ${{ matrix.config.timeout }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release', timeout: 15}
          - {os: windows-latest, r: 'release', timeout: 20}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release', timeout: 60}
          - {os: ubuntu-latest,   r: 'release', timeout: 30}
          - {os: ubuntu-latest,   r: 'oldrel-1', timeout: 30}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
